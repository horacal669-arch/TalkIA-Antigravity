<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkIA Antigravity — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0b0f1a 0%, #1a1f2e 50%, #0f1320 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}
.login-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 40px 30px;
  backdrop-filter: blur(20px);
  text-align: center;
}
.logo { font-size: 48px; margin-bottom: 16px; }
.brand {
  font-size: 22px;
  font-weight: 700;
  color: #d4a843;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.subtitle {
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 32px;
}
.input-group { margin-bottom: 16px; text-align: left; }
.input-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
.input-field {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 16px;
  color: #e2e8f0;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.input-field:focus { border-color: #d4a843; }
.btn-login {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #d4a843, #b8922e);
  color: #0b0f1a;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.2s;
}
.btn-login:active { transform: scale(0.97); }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: #475569;
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.08);
}
.btn-panel {
  width: 100%;
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  background: transparent;
  color: #94a3b8;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-panel:hover { border-color: #d4a843; color: #d4a843; }
.error-msg {
  color: #ef4444;
  font-size: 12px;
  margin-top: 8px;
  display: none;
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="logo">🏔️</div>
    <div class="brand">TALKIA ANTIGRAVITY</div>
    <div class="subtitle">Hotel & Tourism AI Platform</div>

    <div class="input-group">
      <div class="input-label">Usuario / Username</div>
      <input type="text" class="input-field" id="username" placeholder="admin">
    </div>
    <div class="input-group">
      <div class="input-label">Contraseña / Password</div>
      <input type="password" class="input-field" id="password" placeholder="••••••••">
    </div>
    <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</div>
    <button class="btn-login" onclick="doLogin()">Iniciar Sesión / Log In</button>

    <div class="divider">Panel de Recepción</div>
    <button class="btn-panel" onclick="window.location='/panel'">📊 Staff Dashboard</button>
  </div>
</div>
<script>
function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  if (user === 'admin' && pass === 'talkia2026') {
    window.location = '/config';
  } else if (user && pass) {
    window.location = '/panel';
  } else {
    document.getElementById('errorMsg').style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
