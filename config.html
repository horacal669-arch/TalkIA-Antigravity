<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkIA — Configuración</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4a843;--gold2:#f0cc70;--gold-dim:rgba(212,168,67,0.1);--border:rgba(212,168,67,0.2);--text:#f5eedc;--text-dim:rgba(245,238,220,0.45);--surface:rgba(255,255,255,0.04);--bg:#03060f;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Tenor Sans',sans-serif;min-height:100vh;padding:24px 16px;display:flex;justify-content:center;}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 120% 55% at 50% 100%,#0a1628 0%,transparent 70%);}
.wrap{position:relative;z-index:10;width:100%;max-width:520px;}
header{text-align:center;margin-bottom:24px;}
.logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2rem;letter-spacing:0.25em;color:var(--gold2);}
.sub{font-size:0.55rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--text-dim);margin-top:4px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;}
.card-title{font-size:0.55rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--text-dim);margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px;}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Tenor Sans',sans-serif;font-size:0.85rem;outline:none;transition:border-color 0.3s;}
.field input:focus,.field textarea:focus{border-color:var(--gold);}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim);}
.field textarea{resize:vertical;min-height:60px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.toggle-info .tl{font-size:0.8rem;color:var(--text);}
.toggle-info .ts{font-size:0.62rem;color:var(--text-dim);margin-top:2px;}
.toggle{position:relative;width:46px;height:26px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:rgba(255,255,255,0.1);border:1px solid var(--border);border-radius:13px;cursor:pointer;transition:all 0.3s;}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform 0.3s;}
input:checked+.slider{background:var(--gold);border-color:var(--gold);}
input:checked+.slider::before{transform:translateX(20px);}
.color-preview{width:32px;height:32px;border-radius:8px;flex-shrink:0;border:1px solid var(--border);}
.color-row{display:flex;align-items:center;gap:10px;}
.save-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;color:#03060f;font-family:'Tenor Sans',sans-serif;font-size:0.8rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;margin-top:4px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,18,35,0.97);border:1px solid var(--gold);border-radius:30px;padding:11px 26px;font-size:0.72rem;color:var(--gold2);opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.nav-bar{display:flex;justify-content:center;gap:16px;margin-top:20px;}
.nav-link{color:var(--text-dim);font-size:0.58rem;letter-spacing:0.15em;text-decoration:none;text-transform:uppercase;transition:color 0.2s;}
.nav-link:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
  <header>
    <div class="logo">TalkIA</div>
    <div class="sub">Configuración del Hotel</div>
  </header>

  <div class="card">
    <div class="card-title">Información del Hotel</div>
    <div class="field"><label>Nombre del Hotel</label><input type="text" id="hotelName" placeholder="Ej: Hotel Tierra del Fuego"></div>
    <div class="field"><label>Información General</label><textarea id="hotelInfo" rows="3" placeholder="Descripción breve del hotel, servicios especiales, etc."></textarea></div>
  </div>

  <div class="card">
    <div class="card-title">Horarios y Servicios</div>
    <div class="row2">
      <div class="field"><label>Horario Desayuno</label><input type="text" id="breakfastTime" placeholder="07:00 - 10:00"></div>
      <div class="field"><label>Horario Check-in</label><input type="text" id="checkinTime" placeholder="14:00"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Horario Check-out</label><input type="text" id="checkoutTime" placeholder="12:00"></div>
      <div class="field"><label>Contraseña WiFi</label><input type="text" id="wifiPassword" placeholder="password123"></div>
    </div>
    <div class="field"><label>Actividades / Servicios disponibles</label><textarea id="activities" rows="3" placeholder="Ej: Caminatas guiadas a las 9h, Spa disponible 10-20h, Traslados al aeropuerto..."></textarea></div>
  </div>

  <div class="card">
    <div class="card-title">Apariencia</div>
    <div class="field">
      <label>Color Principal</label>
      <div class="color-row">
        <input type="color" id="primaryColor" value="#d4a843" style="width:60px;height:40px;padding:2px;border-radius:8px;cursor:pointer;">
        <input type="text" id="primaryColorText" placeholder="#d4a843" style="flex:1;">
        <div class="color-preview" id="colorPreview" style="background:#d4a843;"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Notificaciones</div>
    <div class="field"><label>Telegram Chat ID</label><input type="text" id="tgChat" placeholder="ID del chat"></div>
    <div class="toggle-row">
      <div class="toggle-info">
        <div class="tl">Notificar al Staff</div>
        <div class="ts">Texto + audio en español por cada pedido</div>
      </div>
      <label class="toggle"><input type="checkbox" id="notifyTg" checked><span class="slider"></span></label>
    </div>
  </div>

  <button class="save-btn" onclick="saveConfig()">Guardar Configuración</button>

  <div class="nav-bar">
    <a href="panel.html" class="nav-link">← Panel</a>
    <a href="qr_generator.html" class="nav-link">QR Generator</a>
    <a href="index.html" class="nav-link">Ver Interfaz</a>
  </div>
</div>
<div class="toast" id="toast">✓ Guardado correctamente</div>

<script>
document.getElementById('primaryColor').addEventListener('input',function(){
  document.getElementById('primaryColorText').value=this.value;
  document.getElementById('colorPreview').style.background=this.value;
});
document.getElementById('primaryColorText').addEventListener('input',function(){
  const v=this.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    document.getElementById('primaryColor').value=v;
    document.getElementById('colorPreview').style.background=v;
  }
});

async function loadConfig(){
  try{
    const r=await fetch('/api/config'); const c=await r.json();
    document.getElementById('hotelName').value=c.hotel_name||'';
    document.getElementById('hotelInfo').value=c.hotel_info||'';
    document.getElementById('breakfastTime').value=c.breakfast_time||'07:00 - 10:00';
    document.getElementById('checkinTime').value=c.checkin_time||'14:00';
    document.getElementById('checkoutTime').value=c.checkout_time||'12:00';
    document.getElementById('wifiPassword').value=c.wifi_password||'';
    document.getElementById('activities').value=c.activities||'';
    document.getElementById('tgChat').value=c.tg_chat||'';
    document.getElementById('notifyTg').checked=c.notify_telegram!==false;
    const color=c.primary_color||'#d4a843';
    document.getElementById('primaryColor').value=color;
    document.getElementById('primaryColorText').value=color;
    document.getElementById('colorPreview').style.background=color;
  }catch(e){console.error(e);}
}

async function saveConfig(){
  const cfg={
    hotel_name:     document.getElementById('hotelName').value.trim(),
    hotel_info:     document.getElementById('hotelInfo').value.trim(),
    breakfast_time: document.getElementById('breakfastTime').value.trim(),
    checkin_time:   document.getElementById('checkinTime').value.trim(),
    checkout_time:  document.getElementById('checkoutTime').value.trim(),
    wifi_password:  document.getElementById('wifiPassword').value.trim(),
    activities:     document.getElementById('activities').value.trim(),
    tg_chat:        document.getElementById('tgChat').value.trim(),
    notify_telegram:document.getElementById('notifyTg').checked,
    primary_color:  document.getElementById('primaryColorText').value.trim()||document.getElementById('primaryColor').value
  };
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
  const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
loadConfig();
</script>
</body>
</html>
